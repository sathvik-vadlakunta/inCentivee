<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PracticeRank{% endblock %}</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --muted: #6b7280;
            --border: #e5e7eb;
            --text: #111827;
            --text-light: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        nav {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .brand { font-weight: 700; font-size: 1.1rem; color: var(--primary); text-decoration: none; }
        nav .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.9rem;
        }
        nav .nav-links a:hover { color: var(--primary); }
        .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--text-light); }
        h3 { font-size: 1rem; margin-bottom: 0.5rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .grid { display: grid; gap: 1rem; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }
        .stat { text-align: center; }
        .stat .number { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .stat .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-onboarding { background: #dbeafe; color: #1e40af; }
        .badge-paused { background: #fef3c7; color: #92400e; }
        .badge-churned { background: #fee2e2; color: #991b1b; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-granted { background: #d1fae5; color: #065f46; }
        .badge-staged { background: #ede9fe; color: #5b21b6; }
        .badge-archived { background: #e5e7eb; color: #4b5563; }
        .badge-approved { background: #d1fae5; color: #065f46; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 0.5rem; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 0.5rem; border-bottom: 1px solid var(--border); }
        tr:hover { background: #f9fafb; }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); text-decoration: none; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #047857; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.8rem; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-light);
        }
        .btn-outline:hover { background: var(--bg); text-decoration: none; }
        input, select, textarea {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.25rem; color: var(--text-light); }
        .form-group { margin-bottom: 1rem; }
        .flash { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
        .flash-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .flash-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .stars { color: #f59e0b; }
        .diff-report {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1rem;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
        }
        .mt-1 { margin-top: 0.5rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .flex { display: flex; gap: 0.5rem; align-items: center; }
        /* Todo list */
        .todo-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; font-size: 0.85rem; }
        .todo-item.done { color: var(--muted); text-decoration: line-through; }
        .todo-check { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; }
        .todo-check.checked { background: var(--success); border-color: var(--success); }
        /* Email preview */
        .email-preview { background: #f9fafb; border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 0.75rem; font-size: 0.85rem; white-space: pre-wrap; font-family: inherit; max-height: 300px; overflow-y: auto; }
        .email-subject { font-weight: 600; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    {% if session.get('logged_in') %}
    <nav>
        <a href="{{ url_for('index') }}" class="brand">PracticeRank</a>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Dashboard</a>
            <a href="{{ url_for('board') }}">Board</a>
            <a href="{{ url_for('runs') }}">Runs</a>
            <a href="{{ url_for('analytics') }}">Analytics</a>
            <a href="{{ url_for('alerts') }}" style="color: var(--danger);">Alerts</a>
            <a href="{{ url_for('audit_logs') }}">Audit</a>
            <a href="{{ url_for('add_customer') }}">+ Add</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
