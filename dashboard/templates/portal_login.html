<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal Login - PracticeRank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a2e; --muted:rgba(26,26,46,.55); --line:rgba(26,26,46,.1);
    --brand:#08080d; --accent:#16a34a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  .login-shell{background:var(--brand);min-height:100vh;padding:60px 20px;display:flex;justify-content:center}
  .login-card{background:#fff;border-radius:16px;padding:36px 34px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);margin-top:40px;height:fit-content}
  .login-card .brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .login-card h2{margin:8px 0 20px;font-size:22px}
  .field{margin:14px 0}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,163,74,.12)}
  .login-btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14.5px;font-weight:700;margin-top:8px;cursor:pointer;font-family:inherit}
  .login-btn:hover{background:#128a3e}
  .mini{font-size:12px;color:var(--muted)}
  .flash{padding:.65rem .85rem;border-radius:8px;margin-bottom:14px;font-size:13px}
  .flash-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
  .flash-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
</style>
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="brand">PracticeRank</div>
    <h2>Client Portal</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" action="{{ url_for('portal_login') }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
    <p class="mini" style="margin-top:16px;text-align:center">Trouble logging in? Contact your PracticeRank account manager.</p>
  </div>
</div>
</body>
</html>
