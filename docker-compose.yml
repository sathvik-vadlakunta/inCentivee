services:
  geo-agent:
    build: .
    image: dentalrank-geo-agent:latest
    container_name: practicerank-geo-agent
    env_file: .env
    volumes:
      - geo-data:/app/data
    command: ["python", "-m", "geo_agent.main"]
    restart: "no"
    networks:
      - practicerank
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp:size=50M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Resource limits — won't compete with options-owl
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  geo-data:

networks:
  practicerank:
    name: practicerank
    driver: bridge
